[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maritimeiq"
version = "0.1.0"
description = "Agentic data activation pipeline for shipping (Bronze → Silver → Gold)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
