# Daytona workspace hint for MaritimeIQ
# Docs: https://www.daytona.io/docs
#
# Suggested flow:
#   1. Create workspace from this repo
#   2. Inject secrets: OPENAI_API_KEY (or Vertex vars)
#   3. In terminal: make install && make demo && make ui
#   4. Forward port 8501 for the ops console

name: maritimeiq
image: eclipse-temurin:17-jdk-jammy
ports:
  - 8501
env:
  - MARITIMEIQ_PYTHON=python3
  - PYSPARK_PYTHON=python3
  - PYSPARK_DRIVER_PYTHON=python3
postCreate:
  - apt-get update && apt-get install -y python3 python3-pip python3-venv
  - python3 -m pip install -U pip && pip install -r requirements.txt && pip install -e .
readme: |
  MaritimeIQ agentic shipping lakehouse.
  Run `make demo` then `make ui` and open port 8501.
